services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: venturoproforma
      POSTGRES_USER: venturo
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - venturo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venturo -d venturoproforma"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://venturo:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/venturoproforma
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      SERVICE_FQDN_APP_3010: ${SERVICE_FQDN_APP_3010:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3010"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3010/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  venturo_postgres_data:
